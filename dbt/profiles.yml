safeeats_athena:
  target: dev
  outputs:
    dev:
      type: athena
      database: awsdatacatalog
      schema: "{{ env_var('ATHENA_DBT_SCHEMA', 'safeeats_gold') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      work_group: "{{ env_var('ATHENA_WORKGROUP', 'primary') }}"
      aws_profile_name: "{{ env_var('AWS_PROFILE', 'safeeats-dev') }}"
      s3_staging_dir: "s3://{{ env_var('SAFEEATS_S3_BUCKET') }}/athena/dbt-query-results/"
      s3_data_dir: "s3://{{ env_var('SAFEEATS_S3_BUCKET') }}/gold/"
      s3_tmp_table_dir: "s3://{{ env_var('SAFEEATS_S3_BUCKET') }}/athena/dbt-temp/"
      s3_data_naming: schema_table_unique
      threads: 2
      num_retries: 3

